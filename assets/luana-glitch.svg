<svg width="900" height="120" viewBox="0 0 900 120" fill="none" xmlns="http://www.w3.org/2000/svg">

<style>
.background {
  fill: #0D1117;
}

.main {
  fill: #FF003C;
  font-family: 'Courier New', monospace;
  font-size: 42px;
  font-weight: bold;
}

.glitch-red {
  fill: #FF003C;
  opacity: .9;
  animation: glitch-red 2s infinite;
}

.glitch-blue {
  fill: #00F5FF;
  opacity: .5;
  animation: glitch-blue 2s infinite;
}

.scan {
  opacity: .1;
  animation: flicker 3s infinite;
}

@keyframes glitch-red {
  0% { transform: translate(0px,0px); }
  20% { transform: translate(-2px,1px); }
  40% { transform: translate(2px,-1px); }
  60% { transform: translate(-1px,0px); }
  80% { transform: translate(1px,1px); }
  100% { transform: translate(0px,0px); }
}

@keyframes glitch-blue {
  0% { transform: translate(0px,0px); }
  20% { transform: translate(2px,-1px); }
  40% { transform: translate(-2px,1px); }
  60% { transform: translate(1px,0px); }
  80% { transform: translate(-1px,-1px); }
  100% { transform: translate(0px,0px); }
}

@keyframes flicker {
  0% { opacity: .1; }
  50% { opacity: .2; }
  100% { opacity: .1; }
}
</style>

<rect width="100%" height="100%" class="background"/>

<g class="scan">
  <rect x="0" y="10" width="900" height="1" fill="#FFFFFF"/>
  <rect x="0" y="30" width="900" height="1" fill="#FFFFFF"/>
  <rect x="0" y="50" width="900" height="1" fill="#FFFFFF"/>
  <rect x="0" y="70" width="900" height="1" fill="#FFFFFF"/>
  <rect x="0" y="90" width="900" height="1" fill="#FFFFFF"/>
</g>

<text x="450" y="70" text-anchor="middle" class="main glitch-blue">
Olá, eu sou Luana :)
</text>

<text x="450" y="70" text-anchor="middle" class="main glitch-red">
Olá, eu sou Luana :)
</text>

</svg>
